<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff – KPL Visitor Register</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="nav-host"></div>

  <div class="page">
    <h1>Staff Accounts</h1>
    <p class="subtitle">Manage who can use the visitor register, and change your own password.</p>

    <div id="content">
      <div class="grid grid-2">
        <div class="card">
          <h2 style="margin-top:0; font-size:1.05rem;">Add Staff Account</h2>
          <form id="add-form">
            <div class="field">
              <label for="full_name">Full Name</label>
              <input id="full_name" required />
            </div>
            <div class="field">
              <label for="username">Username</label>
              <input id="username" required />
            </div>
            <div class="field">
              <label for="password">Temporary Password</label>
              <input id="password" type="password" minlength="6" required />
            </div>
            <div class="field">
              <label for="role">Role</label>
              <select id="role">
                <option value="staff">Staff</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <button class="btn" type="submit">Add Account</button>
          </form>
        </div>

        <div class="card">
          <h2 style="margin-top:0; font-size:1.05rem;">Change My Password</h2>
          <form id="pw-form">
            <div class="field">
              <label for="current_password">Current Password</label>
              <input id="current_password" type="password" required />
            </div>
            <div class="field">
              <label for="new_password">New Password</label>
              <input id="new_password" type="password" minlength="6" required />
            </div>
            <button class="btn btn-secondary" type="submit">Update Password</button>
          </form>
        </div>
      </div>

      <div class="card">
        <h2 style="margin-top:0; font-size:1.05rem;">All Accounts</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Created</th><th></th></tr></thead>
            <tbody id="users-body"><tr><td colspan="5" class="empty-state">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    let me = null;

    async function loadUsers() {
      const users = await Api.get("/auth/users");
      document.getElementById("users-body").innerHTML = users
        .map(
          (u) => `
          <tr>
            <td>${escapeHtml(u.full_name)}</td>
            <td>${escapeHtml(u.username)}</td>
            <td>${escapeHtml(u.role)}</td>
            <td>${new Date(u.created_at + "Z").toLocaleDateString()}</td>
            <td>${u.id === me.id ? "" : `<button class="btn btn-sm btn-danger" onclick="removeUser(${u.id}, '${escapeHtml(u.full_name).replace(/'/g, "\\'")}')">Remove</button>`}</td>
          </tr>`
        )
        .join("");
    }

    async function removeUser(id, name) {
      if (!confirm(`Remove staff account "${name}"?`)) return;
      try {
        await Api.del(`/auth/users/${id}`);
        toast("Account removed", "success");
        loadUsers();
      } catch (err) {
        toast(err.message, "error");
      }
    }

    document.getElementById("add-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await Api.post("/auth/users", {
          full_name: document.getElementById("full_name").value.trim(),
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
          role: document.getElementById("role").value,
        });
        toast("Staff account created", "success");
        e.target.reset();
        loadUsers();
      } catch (err) {
        toast(err.message, "error");
      }
    });

    document.getElementById("pw-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await Api.post("/auth/change-password", {
          currentPassword: document.getElementById("current_password").value,
          newPassword: document.getElementById("new_password").value,
        });
        toast("Password updated", "success");
        e.target.reset();
      } catch (err) {
        toast(err.message, "error");
      }
    });

    (async () => {
      me = await renderNav("staff");
      if (!me) return;
      if (me.role !== "admin") {
        document.querySelector(".grid-2 .card:first-child").outerHTML =
          '<div class="card empty-state">Only admin accounts can add or remove staff.</div>';
        document.querySelector(".card:has(#users-body)").remove();
        return;
      }
      loadUsers();
    })();
  </script>
</body>
</html>
