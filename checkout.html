<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check Out – KPL Visitor Register</title>
  <link rel="icon" type="image/jpeg" href="img/kpl-logo.jpg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav-host"></div>

  <div class="page">
    <h1>Visitor Check-Out</h1>
    <p class="subtitle">Find yourself by name, ID or PC serial number, then confirm you're leaving.</p>

    <div class="card">
      <div class="field" style="margin-bottom: 0;">
        <label for="q">Search</label>
        <input id="q" placeholder="Name, ID number or PC serial…" autocomplete="off" autofocus />
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>ID Number</th><th>PC Serial</th><th>Checked In Since</th><th></th></tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="5" class="empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav("Check Out");

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    let active = [];

    function render() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const rows = q
        ? active.filter(
            (v) =>
              (v.full_name || "").toLowerCase().includes(q) ||
              (v.id_number || "").toLowerCase().includes(q) ||
              (v.computer_serial || "").toLowerCase().includes(q)
          )
        : active;

      const body = document.getElementById("rows");
      if (!rows.length) {
        body.innerHTML = `<tr><td colspan="5" class="empty-state">${
          active.length ? "No match — check the spelling and try again." : "Nobody is currently checked in."
        }</td></tr>`;
        return;
      }

      body.innerHTML = rows
        .map(
          (v) => `
          <tr>
            <td>${escapeHtml(v.full_name)}</td>
            <td>${escapeHtml(v.id_number || "—")}</td>
            <td>${escapeHtml(v.computer_serial || "—")}</td>
            <td>${new Date(v.check_in_time + "Z").toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</td>
            <td><button class="btn btn-sm" onclick="checkout(${v.id}, '${escapeHtml(v.full_name).replace(/'/g, "\\'")}')">Confirm Check-Out</button></td>
          </tr>`
        )
        .join("");
    }

    async function checkout(id, name) {
      if (!confirm(`Confirm ${name} is leaving now?`)) return;
      try {
        await Api.post(`/visits/${id}/checkout`, {});
        toast(`${name} checked out`, "success");
        load();
      } catch (err) {
        toast(err.message, "error");
      }
    }

    async function load() {
      try {
        active = await Api.get("/visits/active");
        render();
      } catch (e) {
        // handled by api.js
      }
    }

    document.getElementById("q").addEventListener("input", render);

    load();
  </script>
</body>
</html>
