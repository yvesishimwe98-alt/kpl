<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter Passcode – KPL Visitor Register</title>
  <link rel="icon" type="image/jpeg" href="img/kpl-logo.jpg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1><img src="img/kpl-logo.jpg" alt="" class="auth-logo" />Kigali Public Library</h1>
      <p class="subtitle">Visitor Register — enter the front-desk passcode</p>
      <form id="passcode-form">
        <div class="field">
          <label for="passcode">Passcode</label>
          <input id="passcode" name="passcode" type="password" inputmode="numeric" autocomplete="off" required autofocus />
        </div>
        <div class="error-text" id="error-text"></div>
        <button class="btn" type="submit" id="submit-btn">Unlock</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("passcode-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      const errorEl = document.getElementById("error-text");
      errorEl.textContent = "";
      btn.disabled = true;
      btn.textContent = "Checking...";
      try {
        const passcode = document.getElementById("passcode").value;
        const res = await fetch("/api/auth/unlock", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ passcode }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Unlock failed");
        window.location.href = "/";
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = "Unlock";
        document.getElementById("passcode").select();
      }
    });
  </script>
</body>
</html>
